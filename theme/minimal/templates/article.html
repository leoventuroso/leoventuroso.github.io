{% extends "base.html" %}
{% block title %}{{ article.title }}{% endblock %}
{% block nav_active %}{% endblock %}
{% block content %}
<article class="blog-post">
  <h1 class="title">{{ article.title }}</h1>
  <div class="meta">
    <time datetime="{{ article.date.isoformat() }}">{{ article.date.strftime('%B %-d, %Y') }}</time>
  </div>
  <div class="prose">
    {{ article.content|sidenotes }}
  </div>
  <p class="see-all"><a href="{{ SITEURL }}/blog/">&larr; back to blog</a></p>
</article>
{% endblock %}
